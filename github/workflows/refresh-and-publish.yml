name: Refresh and publish Welly Oddities

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily around 6:23am NZ daylight time (7:23am in standard time).
    - cron: '23 17 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: welly-oddities-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: WellyOddities/requirements.txt
      - name: Install scraper dependencies
        run: python -m pip install -r WellyOddities/requirements.txt
      - name: Refresh the public source index
        run: python WellyOddities/refresh_for_web.py
      - name: Build public site and event feed
        run: python WellyOddities/build_public.py
      - name: Persist refreshed cache for future runs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WellyOddities/index_cache.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update event index [skip ci]'
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy public link
        id: deployment
        uses: actions/deploy-pages@v4
