name: Refresh and publish Welly Oddities

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily around 6:23am NZ daylight time (7:23am in standard time).
    - cron: '23 17 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: welly-oddities-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: WellyOddities/requirements.txt
      - name: Install scraper dependencies
        run: python -m pip install -r WellyOddities/requirements.txt
      # Each run gets the latest successful cache without modifying repository history.
      - name: Restore previous event index
        uses: actions/cache/restore@v4
        with:
          path: WellyOddities/index_cache.json
          key: welly-oddities-index-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            welly-oddities-index-
      - name: Refresh the public source index
        run: python WellyOddities/refresh_for_web.py
      - name: Build public site and event feed
        run: python WellyOddities/build_public.py
      - name: Save refreshed event index
        uses: actions/cache/save@v4
        with:
          path: WellyOddities/index_cache.json
          key: welly-oddities-index-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy public link
        id: deployment
        uses: actions/deploy-pages@v4
